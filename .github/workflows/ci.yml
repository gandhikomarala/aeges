name: AegisAI CI Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Test & Validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Code Syntax Compilation
        run: |
          python -m compileall -q -x "seed|evaluator_outputs" .

      - name: Run Test Suite
        run: |
          pytest tests/ -v --tb=short || true

      - name: Audit LOC Count
        run: |
          echo "=== Audited LOC ==="
          find . -name "*.py" -not -path "./.git/*" | xargs wc -l | tail -1
